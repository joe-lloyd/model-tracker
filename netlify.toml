[build]
  command = "pnpm run build"
  publish = "apps/web/dist"
  functions = "functions"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/web packages/shared functions netlify.toml package.json pnpm-lock.yaml"

[dev]
  command = "turbo run dev --filter web"
  framework = "#auto"
  publish = "apps/web/dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
